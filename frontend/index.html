<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/life.css">
<script type="importmap">{"imports":{"three":"/static/vendor/three/build/three.module.js"}}</script>
<script src="/static/vendor/d3.min.js"></script>
<script src="/static/vendor/gsap.min.js"></script>
</head>
<body>
<header class="nav">
  <div class="logo"><span class="dot"></span>Orbit</div>
  <nav id="tabs">
    <button data-v="vie" class="on">Ma vie</button>
    <button data-v="choix">Mes choix</button>
    <button data-v="agents">Agents</button>
    <button data-v="profil">Profil</button>
  </nav>
  <div class="me"><span id="me-name">Camille Moreau</span><span class="ini" id="me-ini">CM</span></div>
</header>

<main>
  <section class="view on" id="v-vie">
    <div class="stage">
      <canvas id="avatar"></canvas>
      <div class="age-tag"><div class="age"><span id="age">32</span><small>ans</small></div><div class="yr" id="yr">2026</div></div>
      <div class="loading" id="av-load">Chargement</div>
    </div>
    <div class="side">
      <div class="eyebrow" id="when">Aujourd'hui</div>
      <div class="big" id="net">—</div>
      <div class="sub">Patrimoine net, en euros d'aujourd'hui</div>
      <div class="seg" id="seg">
        <button data-s="bad">Défavorable</button><button data-s="mid" class="on">Médian</button><button data-s="good">Favorable</button>
        <i class="seg-k"></i>
      </div>
      <div class="replay" id="replay"></div>
      <svg id="chart"></svg>
      <div class="facts" id="facts"></div>
      <p class="story" id="story"></p>
    </div>
    <div class="timeline">
      <div class="tl-track"><input type="range" id="t" min="0" max="60" step="0.01" value="0"></div>
      <div class="ticks" id="ticks"></div>
    </div>
  </section>
  <section class="view" id="v-choix"><div class="soon">Mes choix · en construction</div></section>
  <section class="view" id="v-agents"><div class="soon">Agents en direct · en construction</div></section>
  <section class="view" id="v-profil"><div class="soon">Profil · en construction</div></section>
</main>
<footer class="foot" id="foot"></footer>
<script type="module" src="/static/life.js"></script>
</body>
</html>
